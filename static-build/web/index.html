<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Predict Mobile</title>
<link rel="stylesheet" href="/fonts/tap-cursor.css" />
<style>
  :root {
    --phone-w: 393px;
    --phone-h: 852px;
    --bezel: 10px;
  }
  html, body { margin: 0; height: 100%; background: #0b0b0b; }
  body {
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .device {
    width: calc(var(--phone-w) + var(--bezel) * 2);
    height: calc(var(--phone-h) + var(--bezel) * 2);
    transform-origin: center center;
  }
  .bezel {
    position: relative;
    width: 100%;
    height: 100%;
    padding: var(--bezel);
    box-sizing: border-box;
    border-radius: 54px;
    background: #1a1a1a;
    box-shadow:
      0 0 0 1px #2a2a2a,
      0 24px 80px rgba(0,0,0,0.55);
  }
  .screen {
    position: relative;
    width: var(--phone-w);
    height: var(--phone-h);
    border-radius: 44px;
    overflow: hidden;
    background: #000;
  }
  .screen iframe {
    width: var(--phone-w);
    height: var(--phone-h);
    border: 0;
    display: block;
    background: #000;
  }
  .island { pointer-events: none; position: absolute; z-index: 2; }
  .island {
    top: 10px;
    left: 50%;
    width: 120px;
    height: 34px;
    margin-left: -60px;
    border-radius: 20px;
    background: #000;
  }
  @media (max-width: 480px) {
    body { display: block; }
    .device, .bezel, .screen {
      width: 100vw;
      height: 100vh;
      padding: 0;
      border-radius: 0;
      box-shadow: none;
      background: #000;
    }
    .screen iframe { width: 100vw; height: 100vh; }
    .island { display: none; }
  }
</style>
</head>
<body>
  <div class="device" id="device">
    <div class="bezel">
      <div class="screen">
        <div class="island" aria-hidden="true"></div>
        <iframe src="/app.html" title="Predict Mobile" allow="clipboard-write"></iframe>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var device = document.getElementById("device");
      var phoneW = 393 + 20;
      var phoneH = 852 + 20;
      function fit() {
        if (window.innerWidth <= 480) {
          device.style.transform = "";
          return;
        }
        var scale = Math.min(
          1,
          (window.innerWidth - 40) / phoneW,
          (window.innerHeight - 40) / phoneH
        );
        device.style.transform = "scale(" + scale + ")";
      }
      window.addEventListener("resize", fit);
      fit();
      window.addEventListener("keydown", function (event) {
        if (event.isComposing) return;
        if (!(event.metaKey || event.ctrlKey) || event.altKey || event.shiftKey) return;
        if (event.key !== "s" && event.key !== "S") return;
        event.preventDefault();
        var frame = document.querySelector(".screen iframe");
        if (frame && frame.contentWindow) {
          frame.contentWindow.postMessage({ type: "predict:toggle-settings-fab" }, "*");
        }
      });
    })();
  </script>
</body>
</html>
